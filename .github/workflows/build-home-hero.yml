name: Build CareerPath homepage hero asset

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-home-hero.yml"
      - "site-assets/careerpath-home-hero-approved.svg"

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract approved JPG from SVG wrapper
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, base64
          src = Path("site-assets/careerpath-home-hero-approved.svg").read_text()
          m = re.search(r'data:image/jpeg;base64,([^"]+)', src)
          if not m:
              raise SystemExit("Embedded approved JPEG not found")
          data = base64.b64decode(m.group(1))
          if len(data) < 5000:
              raise SystemExit(f"Hero image too small: {len(data)} bytes")
          Path("site-assets/careerpath-home-hero-approved.jpg").write_bytes(data)
          print(f"Wrote {len(data)} bytes")
          PY
      - name: Commit binary hero asset
        run: |
          git config user.name "careerpathrecruitment"
          git config user.email "info@careerpathrecruitment.co.uk"
          git add site-assets/careerpath-home-hero-approved.jpg
          if git diff --cached --quiet; then
            echo "No asset change"
            exit 0
          fi
          git commit -m "Publish approved CareerPath homepage hero JPG"
          git push origin HEAD:main
